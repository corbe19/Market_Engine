[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "market-engine"
version = "0.0.1"
description = "Real-time market microstructure intelligence platform"
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
# Runtime dependencies are added by the milestone that first needs them.
# Milestone 0 deliberately has none: the skeleton must import and test with a
# bare interpreter so environment problems cannot masquerade as code problems.
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "mypy>=1.11",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers --strict-config"
markers = [
    "slow: long-running; excluded from the fast inner loop",
    "live: needs a live exchange connection; never runs in CI",
    "benchmark: performance measurement, not a correctness assertion",
]

[tool.ruff]
src = ["src", "tests"]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = [
    "E",    # pycodestyle
    "F",    # pyflakes
    "I",    # import sorting
    "B",    # bugbear
    "UP",   # pyupgrade
    "SIM",  # simplify
    "RUF",  # ruff-specific
]

[tool.mypy]
python_version = "3.11"
mypy_path = "src"
packages = ["market_engine"]
strict = true
warn_unreachable = true
# Point-in-time correctness depends on never silently mixing up timestamp
# units or price representations, so implicit Any is treated as an error.
disallow_any_explicit = false
